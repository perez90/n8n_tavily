name: Build, push and inspect image (plain logs)

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          docker --version
          node --version
          npm --version

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (plain output)
        run: |
          docker build --progress=plain -t docker.io/abarbero90/n8n-tavily:latest .

      - name: Push image
        run: |
          docker push docker.io/abarbero90/n8n-tavily:latest

      - name: Inspect pushed image (list /home/node/.n8n/custom)
        run: |
          echo "Pulled image and listing inside with /bin/sh (sobreescribiendo entrypoint)"
          docker run --rm --entrypoint /bin/sh docker.io/abarbero90/n8n-tavily:latest -c "echo '--- ls -la /home/node/.n8n/custom ---'; ls -la /home/node/.n8n/custom || true; echo '--- ls -la /home/node/.n8n/custom/node_modules ---'; ls -la /home/node/.n8n/custom/node_modules || true; echo '--- grep tavily ---'; ls -la /home/node/.n8n/custom/node_modules 2>/dev/null | grep tavily || echo 'no tavily encontrado'; echo '--- package.json ---'; cat /home/node/.n8n/custom/package.json 2>/dev/null || echo 'no package.json'"
